# ==========================================
# 1. IDENTITÀ ESPERIMENTO
# ==========================================
model_name: "CustomResNet18_SGD_HeadCrop"  # Nome esperimento
resume_training: True                       # Se True, cerca il checkpoint
save_on_drive: False                        # Salvataggio su Google Drive

# ==========================================
# 2. DATI E TRASFORMAZIONI
# ==========================================
batch_size: 32
download_data: True
use_augmentation: True     # Attiva rotazioni, flip, ecc. nel training
use_head_crop: True        

# ==========================================
# 3. MODELLO E TASK
# ==========================================
fine_tuning: False         # False = Train from Scratch; True = Pretrained weights
loss: "CrossEntropy"      

# ==========================================
# 4. TRAINING LOOP
# ==========================================
epochs: 50
patience: 25               # Patience per Early Stopping (consiglio: disabilita o tieni alto)

# ==========================================
# 5. OTTIMIZZAZIONE
# ==========================================
optimizer: "SGD"          
learning_rate: 0.01        
weight_decay: 0.0005      
momentum: 0.9              # Standard per SGD
nesterov: True             # Boost per SGD

# ==========================================
# 6. SCHEDULER 
# ==========================================
scheduler: "OneCycleLR"   
scheduler_patience: 3      